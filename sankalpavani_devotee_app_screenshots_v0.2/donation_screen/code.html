<!-- TopAppBar -->

<button aria-label="Menu" class="text-white-muted hover:text-gold-secondary transition-colors scale-95 active:duration-150 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="temple_hindu">temple_hindu</span>
</button>
<h1 class="font-display-vertical text-display-vertical text-gold-primary tracking-[0.2em] uppercase">SANKALPAVANI</h1>
<button aria-label="Notifications" class="text-white-muted hover:text-gold-secondary transition-colors scale-95 active:duration-150 p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->

<div class="relative w-24 h-24 mx-auto rounded-full bg-navy-surface border border-border-subtle flex items-center justify-center overflow-hidden shadow-[0_0_30px_rgba(220,176,107,0.15)]">
<span class="material-symbols-outlined text-5xl text-gold-primary" data-icon="volunteer_activism" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Make a Contribution</h2>
<p class="font-body-md text-body-md text-white-muted max-w-[280px] mx-auto">Support the maintenance and ongoing sevas of our sacred temples.</p>
</div>
</section>
<!-- Donation Amount Selector -->
<section class="flex flex-col gap-stack-sm">
<h3 class="font-label-caps text-label-caps text-white-muted tracking-widest uppercase">Select Amount</h3>
<div class="grid grid-cols-2 gap-gutter-grid">
<!-- Amount Card 1 -->
<button class="bg-navy-surface border border-gold-primary/30 rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:border-gold-primary transition-colors focus:outline-none focus:ring-2 focus:ring-gold-primary focus:ring-offset-2 focus:ring-offset-navy-bg relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-gold-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-headline-md text-headline-md text-gold-primary">₹501</span>
<span class="font-label-caps text-label-caps text-white-muted">Annadhanam</span>
</button>
<!-- Amount Card 2 (Active state simulation) -->
<button class="bg-navy-surface border-2 border-gold-primary rounded-xl p-4 flex flex-col items-center justify-center gap-2 relative overflow-hidden focus:outline-none shadow-[inset_0_0_20px_rgba(220,176,107,0.1)]">
<div class="absolute inset-0 bg-gradient-to-br from-gold-primary/10 to-transparent"></div>
<span class="material-symbols-outlined absolute top-2 right-2 text-gold-primary text-sm" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md text-gold-primary">₹1001</span>
<span class="font-label-caps text-label-caps text-white-muted">Vastra Dhanam</span>
</button>
<!-- Amount Card 3 -->
<button class="bg-navy-surface border border-white-muted/10 rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:border-gold-primary/50 transition-colors focus:outline-none group">
<div class="absolute inset-0 bg-gradient-to-br from-gold-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-headline-md text-headline-md text-white-muted group-hover:text-gold-primary transition-colors">₹5001</span>
<span class="font-label-caps text-label-caps text-white-muted/60 group-hover:text-white-muted transition-colors">Maha Seva</span>
</button>
<!-- Amount Card 4 (Custom) -->
<button class="bg-navy-surface border border-white-muted/10 rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:border-gold-primary/50 transition-colors focus:outline-none group">
<div class="absolute inset-0 bg-gradient-to-br from-gold-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-headline-sm text-headline-sm text-white-muted group-hover:text-gold-primary transition-colors">Custom</span>
<span class="font-label-caps text-label-caps text-white-muted/60 group-hover:text-white-muted transition-colors">Enter Amount</span>
</button>
</div>
</section>

<section class="flex flex-col gap-stack-sm">
<h3 class="font-label-caps text-label-caps text-white-muted tracking-widest uppercase">Dedicate To</h3>
<div class="flex flex-col gap-2">
<label class="flex items-center gap-4 p-4 bg-navy-surface rounded-xl border border-white-muted/10 hover:border-gold-primary/30 transition-colors cursor-pointer">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-white-muted/30 rounded-full checked:border-gold-primary transition-colors focus:ring-0 focus:ring-offset-0 bg-transparent" name="cause" type="radio"/>
<div class="absolute w-2.5 h-2.5 bg-gold-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface">General Temple Maintenance</span>
</label>
<label class="flex items-center gap-4 p-4 bg-navy-surface rounded-xl border border-gold-primary/30 cursor-pointer shadow-[inset_0_0_15px_rgba(220,176,107,0.05)]">
<div class="relative flex items-center justify-center">
<input checked="" class="peer appearance-none w-5 h-5 border-2 border-white-muted/30 rounded-full checked:border-gold-primary transition-colors focus:ring-0 focus:ring-offset-0 bg-transparent" name="cause" type="radio"/>
<div class="absolute w-2.5 h-2.5 bg-gold-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-gold-primary">Upcoming Festival Corpus</span>
<span class="font-body-md text-body-md text-white-muted text-sm">Special Navaratri preparations</span>
</div>
</label>
</div>
