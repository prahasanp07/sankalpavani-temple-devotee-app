<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sankalpavani - Payment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#d2c4b4",
                        "on-error": "#690005",
                        "gold-primary": "#dcb06b",
                        "surface": "#0c1322",
                        "primary-container": "#dcb06b",
                        "on-primary-fixed": "#281900",
                        "on-primary-container": "#614205",
                        "secondary-fixed-dim": "#f2be72",
                        "navy-surface": "#1f2937",
                        "error": "#ffb4ab",
                        "surface-dim": "#0c1322",
                        "primary-fixed": "#ffdeae",
                        "surface-container-low": "#141b2b",
                        "inverse-on-surface": "#293040",
                        "tertiary-fixed-dim": "#aac8f6",
                        "secondary-fixed": "#ffddb1",
                        "on-secondary-fixed-variant": "#624000",
                        "surface-container-high": "#232a3a",
                        "tertiary-fixed": "#d4e3ff",
                        "outline": "#9b8f80",
                        "on-tertiary": "#0e3157",
                        "on-secondary-container": "#e6b369",
                        "surface-container-lowest": "#070e1d",
                        "surface-tint": "#edbf79",
                        "on-secondary": "#442b00",
                        "on-tertiary-fixed-variant": "#29486f",
                        "on-tertiary-fixed": "#001c39",
                        "surface-variant": "#2e3545",
                        "gold-secondary": "#b88a44",
                        "secondary-container": "#684400",
                        "primary": "#facb84",
                        "border-subtle": "rgba(255, 255, 255, 0.1)",
                        "secondary": "#f2be72",
                        "white-muted": "rgba(255, 255, 255, 0.7)",
                        "surface-container-highest": "#2e3545",
                        "on-primary": "#432c00",
                        "surface-container": "#191f2f",
                        "inverse-primary": "#7a581c",
                        "primary-fixed-dim": "#edbf79",
                        "on-tertiary-container": "#2a4970",
                        "on-background": "#dce2f7",
                        "background": "#0c1322",
                        "surface-bright": "#323949",
                        "navy-bg": "#111827",
                        "tertiary-container": "#9bb9e6",
                        "tertiary": "#b9d5ff",
                        "error-container": "#93000a",
                        "on-surface": "#dce2f7",
                        "on-primary-fixed-variant": "#604104",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#291800",
                        "inverse-surface": "#dce2f7",
                        "outline-variant": "#4e4539"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-lg": "48px",
                        "section-gap": "40px",
                        "stack-sm": "16px",
                        "stack-md": "32px",
                        "margin-main": "24px",
                        "gutter-grid": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Oswald"],
                        "label-caps": ["Inter"],
                        "headline-lg": ["Oswald"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Oswald"],
                        "body-md": ["Inter"],
                        "display-vertical": ["Oswald"]
                    },
                    "fontSize": {
                        "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg": ["36px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display-vertical": ["20px", {"lineHeight": "normal", "letterSpacing": "0.15em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-navy-bg text-on-background min-h-screen font-body-md antialiased pb-32">
<!-- Header (Transactional - No Global Nav) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md dark:bg-surface-container-lowest/80 border-b border-white-muted/10 shadow-sm flex justify-between items-center px-margin-main h-16">
<button aria-label="Go Back" class="text-gold-primary hover:text-gold-secondary transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display-vertical text-display-vertical text-gold-primary tracking-[0.2em] uppercase">Checkout</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="pt-24 px-margin-main max-w-3xl mx-auto space-y-section-gap">
<!-- Summary Card -->
<section class="bg-navy-surface rounded-xl p-6 border border-white-muted/10 shadow-lg relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-gold-primary/5 rounded-bl-full pointer-events-none"></div>
<h2 class="font-headline-md text-headline-md text-gold-primary mb-stack-md uppercase">Booking Summary</h2>
<div class="space-y-4">
<div class="flex justify-between items-start border-b border-border-subtle pb-4">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Maha Rudrabhishekam</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Sri Kashi Vishwanath Temple, Varanasi</p>
<p class="font-body-md text-body-md text-white-muted mt-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">calendar_today</span> Oct 24, 2024 • 06:00 AM
                        </p>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md text-gold-primary">₹5,100</span>
</div>
</div>
<div class="flex justify-between items-center pt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Prasadam Shipping</span>
<span class="font-body-md text-body-md text-on-surface">₹250</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Convenience Fee</span>
<span class="font-body-md text-body-md text-on-surface">₹100</span>
</div>
<div class="flex justify-between items-center pt-4 border-t border-border-subtle">
<span class="font-headline-sm text-headline-sm text-on-surface uppercase">Total Amount</span>
<span class="font-headline-lg text-headline-lg text-gold-primary">₹5,450</span>
</div>
</div>
</section>
<!-- Payment Methods -->
<section>
<h2 class="font-headline-md text-headline-md text-gold-primary mb-stack-md uppercase">Select Payment Method</h2>
<div class="space-y-4">
<!-- UPI -->
<label class="block bg-navy-surface rounded-lg p-4 border border-gold-primary/50 cursor-pointer hover:bg-surface-variant transition-colors flex items-center gap-4 relative">
<input checked="" class="form-radio text-gold-primary focus:ring-gold-primary border-outline-variant bg-surface-container w-5 h-5" name="payment_method" type="radio" value="upi"/>
<div class="flex-1">
<div class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-gold-primary">qr_code_scanner</span> UPI
                        </div>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">GPay, PhonePe, Paytm</div>
</div>
<div class="absolute top-4 right-4 text-xs font-label-caps text-label-caps text-gold-secondary uppercase px-2 py-1 bg-gold-primary/10 rounded">Recommended</div>
</label>
<!-- Card -->
<label class="block bg-navy-surface rounded-lg p-4 border border-white-muted/10 cursor-pointer hover:bg-surface-variant transition-colors flex items-center gap-4 opacity-75 hover:opacity-100">
<input class="form-radio text-gold-primary focus:ring-gold-primary border-outline-variant bg-surface-container w-5 h-5" name="payment_method" type="radio" value="card"/>
<div class="flex-1">
<div class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">credit_card</span> Credit / Debit Card
                        </div>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">Visa, Mastercard, RuPay</div>
</div>
</label>
<!-- Net Banking -->
<label class="block bg-navy-surface rounded-lg p-4 border border-white-muted/10 cursor-pointer hover:bg-surface-variant transition-colors flex items-center gap-4 opacity-75 hover:opacity-100">
<input class="form-radio text-gold-primary focus:ring-gold-primary border-outline-variant bg-surface-container w-5 h-5" name="payment_method" type="radio" value="netbanking"/>
<div class="flex-1">
<div class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span> Net Banking
                        </div>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">All major banks supported</div>
</div>
</label>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 w-full bg-navy-surface/95 backdrop-blur-md border-t border-white-muted/10 p-margin-main z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.4)]">
<div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Total to Pay</span>
<span class="font-headline-md text-headline-md text-gold-primary">₹5,450</span>
</div>
<button class="flex-1 bg-gold-primary text-navy-bg font-headline-sm text-headline-sm py-4 px-6 rounded-lg uppercase tracking-wider hover:bg-gold-secondary transition-colors flex justify-center items-center gap-2 active:scale-95 duration-150">
<span class="material-symbols-outlined" data-weight="fill">lock</span>
                Pay Securely
            </button>
</div>
</div>
</body></html>
