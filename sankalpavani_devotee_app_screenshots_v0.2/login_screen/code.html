<body class="bg-navy-bg text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-gold-primary selection:text-navy-bg">
<!-- Top Navigation (Suppressed for transactional flow, but keeping brand anchor minimal) -->
<header class="fixed top-0 w-full z-50 flex justify-center items-center px-margin-main h-16 bg-navy-bg/80 backdrop-blur-md">
<div class="font-display-vertical text-display-vertical text-gold-primary tracking-[0.2em] flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">temple_hindu</span>
            SANKALPAVANI
        </div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-main py-section-gap pt-32 relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gold-primary/20 via-navy-bg to-navy-bg z-0"></div>
<div class="w-full max-w-md relative z-10 flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="text-center space-y-4">
<h1 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-wide">Welcome Back</h1>
<p class="font-body-md text-body-md text-white-muted">Enter your details to continue your spiritual journey.</p>
</div>
<!-- Login Form -->
<form class="space-y-stack-md w-full bg-navy-surface p-8 rounded-xl border border-white-muted/5 shadow-2xl relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-gold-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
<!-- Phone Number Input -->
<div class="space-y-2 relative z-10">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider block" for="phone">Mobile Number</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-body-lg text-body-lg text-white-muted pointer-events-none">+91</span>
<input class="w-full bg-navy-bg border border-white-muted/20 text-on-surface font-body-lg text-body-lg rounded-lg pl-14 pr-4 py-3 focus:outline-none focus:border-gold-primary focus:ring-1 focus:ring-gold-primary transition-all duration-300 placeholder:text-white-muted/30" id="phone" placeholder="9876543210" type="tel"/>
<span class="material-symbols-outlined absolute right-4 text-white-muted pointer-events-none">call</span>
</div>
</div>
<!-- OTP Request Button -->
<button class="w-full bg-gold-primary text-navy-bg font-headline-sm text-headline-sm uppercase py-4 rounded-lg hover:bg-gold-secondary transition-colors duration-300 flex items-center justify-center gap-2 active:scale-[0.98] relative z-10" type="button">
                    Request OTP
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center justify-center py-4 z-10">
<div class="absolute inset-x-0 h-px bg-white-muted/10"></div>
<span class="relative bg-navy-surface px-4 font-label-caps text-label-caps text-white-muted uppercase">Or continue with</span>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4 z-10 relative">
<button class="flex items-center justify-center gap-2 bg-navy-bg border border-white-muted/20 hover:border-gold-primary/50 text-on-surface font-body-md text-body-md py-3 rounded-lg transition-all duration-300 group" type="button">
<span class="material-symbols-outlined text-white-muted group-hover:text-gold-primary transition-colors">g_translate</span>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 bg-navy-bg border border-white-muted/20 hover:border-gold-primary/50 text-on-surface font-body-md text-body-md py-3 rounded-lg transition-all duration-300 group" type="button">
<span class="material-symbols-outlined text-white-muted group-hover:text-gold-primary transition-colors">apps</span>
                        Apple
                    </button>
</div>
</form>
<!-- Secondary Action -->
<div class="text-center z-10">
<a class="font-body-md text-body-md text-white-muted hover:text-gold-primary transition-colors inline-flex items-center gap-1 group" href="#">
                    Don't have an account? <span class="font-headline-sm text-headline-sm uppercase text-gold-primary border-b border-transparent group-hover:border-gold-primary ml-1 transition-all">Sign Up</span>
</a>
</div>
</div>
