<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sankalpavani - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Oswald:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#d2c4b4",
                        "on-error": "#690005",
                        "gold-primary": "#dcb06b",
                        "surface": "#0c1322",
                        "primary-container": "#dcb06b",
                        "on-primary-fixed": "#281900",
                        "on-primary-container": "#614205",
                        "secondary-fixed-dim": "#f2be72",
                        "navy-surface": "#1f2937",
                        "error": "#ffb4ab",
                        "surface-dim": "#0c1322",
                        "primary-fixed": "#ffdeae",
                        "surface-container-low": "#141b2b",
                        "inverse-on-surface": "#293040",
                        "tertiary-fixed-dim": "#aac8f6",
                        "secondary-fixed": "#ffddb1",
                        "on-secondary-fixed-variant": "#624000",
                        "surface-container-high": "#232a3a",
                        "tertiary-fixed": "#d4e3ff",
                        "outline": "#9b8f80",
                        "on-tertiary": "#0e3157",
                        "on-secondary-container": "#e6b369",
                        "surface-container-lowest": "#070e1d",
                        "surface-tint": "#edbf79",
                        "on-secondary": "#442b00",
                        "on-tertiary-fixed-variant": "#29486f",
                        "on-tertiary-fixed": "#001c39",
                        "surface-variant": "#2e3545",
                        "gold-secondary": "#b88a44",
                        "secondary-container": "#684400",
                        "primary": "#facb84",
                        "border-subtle": "rgba(255, 255, 255, 0.1)",
                        "secondary": "#f2be72",
                        "white-muted": "rgba(255, 255, 255, 0.7)",
                        "surface-container-highest": "#2e3545",
                        "on-primary": "#432c00",
                        "surface-container": "#191f2f",
                        "inverse-primary": "#7a581c",
                        "primary-fixed-dim": "#edbf79",
                        "on-tertiary-container": "#2a4970",
                        "on-background": "#dce2f7",
                        "background": "#0c1322",
                        "surface-bright": "#323949",
                        "navy-bg": "#111827",
                        "tertiary-container": "#9bb9e6",
                        "tertiary": "#b9d5ff",
                        "error-container": "#93000a",
                        "on-surface": "#dce2f7",
                        "on-primary-fixed-variant": "#604104",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#291800",
                        "inverse-surface": "#dce2f7",
                        "outline-variant": "#4e4539"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-lg": "48px",
                        "section-gap": "40px",
                        "stack-sm": "16px",
                        "stack-md": "32px",
                        "margin-main": "24px",
                        "gutter-grid": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Oswald"],

                        "headline-lg": ["Oswald"],

                    "fontSize": {

                }
            }
        }
    </script>
<style>
        .pulse-gold {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 8px rgba(220, 176, 107, 0.5));
            }
            50% {
                opacity: .7;
                filter: drop-shadow(0 0 2px rgba(220, 176, 107, 0.2));
            }
        }
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-navy-bg h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Background overlay for depth -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface/50 to-navy-bg pointer-events-none z-0"></div>
<!-- Main Content Container -->
<div class="z-10 flex flex-col items-center justify-center flex-1 w-full px-margin-main relative">
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center fade-in-up delay-100 mb-stack-md">
<!-- Icon placeholder - represents the temple/spiritual motif -->
<div class="w-32 h-32 mb-stack-sm rounded-full bg-navy-surface border border-gold-primary/20 flex items-center justify-center shadow-[0_0_40px_rgba(220,176,107,0.15)] pulse-gold relative">
<span class="material-symbols-outlined text-gold-primary" style="font-size: 64px; font-variation-settings: 'FILL' 1;">
                    temple_hindu
                </span>
<div class="absolute inset-0 rounded-full border border-gold-primary/30 animate-[spin_10s_linear_infinite] border-t-transparent border-l-transparent"></div>
</div>
<!-- Brand Typography -->
<h1 class="font-headline-lg text-headline-lg text-gold-primary tracking-widest uppercase text-center mt-stack-sm">
                Sankalpavani
            </h1>
<div class="h-[2px] w-16 bg-gold-secondary/50 mt-stack-sm rounded-full"></div>
</div>
</div>
<!-- Loading State at bottom -->
<div class="z-10 absolute bottom-stack-lg w-full flex flex-col items-center justify-center fade-in-up delay-500">
<p class="font-label-caps text-label-caps text-white-muted uppercase tracking-[0.2em] mb-4">
            Awakening...
        </p>
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-gold-primary pulse-gold" style="animation-delay: 0s;"></div>
<div class="w-2 h-2 rounded-full bg-gold-primary pulse-gold" style="animation-delay: 0.2s;"></div>
<div class="w-2 h-2 rounded-full bg-gold-primary pulse-gold" style="animation-delay: 0.4s;"></div>
</div>
</div>
</body></html>
